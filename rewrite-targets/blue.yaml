---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blue
  template:
    metadata:
      labels:
        app: blue
    spec:
      volumes:
      - name: webdata
        emptyDir: {}

      initContainers:
      - name: web-content
        image: busybox
        volumeMounts:
        - name: webdata
          mountPath: /webdata
        command:
        - /bin/sh
        - -c
        - |
          cat > /webdata/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>BLUE APP</title>

            <style>
              html, body {
                margin: 0;
                width: 100%;
                height: 100%;
              }

              body {
                margin: 0;
                background: #326CE5;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: Arial, sans-serif;
              }

              .container {
                text-align: center;
              }

              .logo {
                width: 180px;
                height: 180px;
                margin-bottom: 35px;
              }

              h1 {
                margin: 0;
                color: white;
                font-size: 64px;
                font-weight: bold;
                letter-spacing: 2px;
              }
            </style>
          </head>

          <body>
            <div class="container">

              <img
                class="logo"
                src="https://raw.githubusercontent.com/cncf/artwork/master/projects/kubernetes/icon/white/kubernetes-icon-white.png"
                alt="Kubernetes">

              <h1>BLUE APP</h1>

            </div>
          </body>
          </html>
          EOF

      containers:
      - name: nginx
        image: nginx
        volumeMounts:
        - name: webdata
          mountPath: /usr/share/nginx/html

---
apiVersion: v1
kind: Service
metadata:
  name: blue
spec:
  type: ClusterIP
  selector:
    app: blue
  ports:
  - port: 80
    targetPort: 80
